<div class="analytics-container">
    <div class="view-header">
        <h2>Region Analytics</h2>
        <div class="controls">
            <!-- Region Filter (Populated by JS) -->
            <select id="analytics-region-select" class="region-select">
                <option value="all">All Regions</option>
            </select>
            <button id="refresh-analytics-btn" class="refresh-btn" onclick="loadAnalyticsData()">🔄 Refresh</button>
        </div>
    </div>

    <!-- Scorecards Section -->
    <div class="scorecards-grid">
        <div class="scorecard">
            <h4>Total Q2 Exit</h4>
            <div class="value" id="stats-total-exit">$0.00</div>
        </div>
        <div class="scorecard">
            <h4>Risk Factor (Upside)</h4>
            <div class="value" id="stats-total-upside">$0.00</div>
        </div>
        <div class="scorecard">
            <h4>New Logos (Count/Sum)</h4>
            <div class="value">
                <span id="stats-new-logo-sum">$0.00</span>
                <small id="stats-new-logo-count">(0)</small>
            </div>
        </div>
        <div class="scorecard">
            <h4>Existing Customers</h4>
            <div class="value">
                <span id="stats-existing-sum">$0.00</span>
                <small id="stats-existing-count">(0)</small>
            </div>
        </div>
        <div class="scorecard warning">
            <h4>Non-Reportable</h4>
            <div class="value">
                <span id="stats-non-rep-sum">$0.00</span>
                <small id="stats-non-rep-count">(0)</small>
            </div>
        </div>
    </div>

    <!-- Breakdown Table -->
    <div class="analytics-table-section">
        <h3>Cluster Breakdown</h3>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Cluster</th>
                        <th>Q2 Exit</th>
                        <th>Upside</th>
                        <th>New Logo ($)</th>
                        <th>New Logo (#)</th>
                        <th>Existing ($)</th>
                        <th>Non-Reportable ($)</th>
                    </tr>
                </thead>
                <tbody id="analytics-table-body">
                    <tr>
                        <td colspan="7" class="loading">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
    .analytics-container {
        padding: 20px;
    }

    .scorecards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .scorecard {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        text-align: center;
    }

    .scorecard h4 {
        margin: 0 0 10px 0;
        color: #64748b;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .scorecard .value {
        font-size: 1.8em;
        font-weight: 700;
        color: #1e293b;
    }

    .scorecard .value small {
        display: block;
        font-size: 0.5em;
        color: #94a3b8;
        font-weight: 600;
        margin-top: 5px;
    }

    .scorecard.warning .value {
        color: #f59e0b;
    }

    .analytics-table-section h3 {
        margin-bottom: 20px;
        color: #334155;
    }
</style>
