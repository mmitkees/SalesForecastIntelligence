<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Login - Consumption Forecast 360 - CF360</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            color: #e0e0e0;
            margin: 0 0 10px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .login-header .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #C74634;
            box-shadow: 0 0 0 3px rgba(199, 70, 52, 0.2);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #C74634 0%, #e74c3c 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(199, 70, 52, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">📊</div>
            <h1>Consumption Forecast 360 - CF360</h1>
            <p class="subtitle">Sign in to continue</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required
                    autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="login-btn">Sign In</button>
        </form>
    </div>

    <script type="module">
        import { login } from './js/api.js';

        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');

        // Environment Detection for Login Page
        function displayEnvironmentBadge() {
            const header = document.querySelector('.login-header h1');
            if (!header) return;

            const hostname = window.location.hostname;
            const isDev = hostname === '129.151.152.53' || hostname === 'localhost' || hostname === '127.0.0.1';
            const isProd = hostname === '129.151.159.172' || hostname.includes('salesforecast');

            if (isDev) {
                const badge = document.createElement('span');
                badge.className = 'env-badge';
                badge.textContent = 'DEV';
                badge.style.display = 'inline-block';
                badge.style.marginLeft = '10px';
                badge.style.marginTop = '0';
                badge.style.verticalAlign = 'middle';
                header.appendChild(badge);
            } else if (isProd) {
                const badge = document.createElement('span');
                badge.className = 'env-badge env-badge-prod';
                badge.textContent = 'PROD';
                badge.style.display = 'inline-block';
                badge.style.marginLeft = '10px';
                badge.style.marginTop = '0';
                badge.style.verticalAlign = 'middle';
                header.appendChild(badge);
            }
        }

        displayEnvironmentBadge();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const user = await login(username, password);
                // Store user in sessionStorage for access after redirect
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                // Redirect to main app
                window.location.href = '/';
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
